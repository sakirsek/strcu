# Third-party notices for strcu.exe, made by cargo-about 0.9 (`cargo install cargo-about --locked --features cli`):
#   cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt
# Licenses are tried in this order for crates with a choice; MIT first keeps the file short.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
# Only what is built into the Windows exe
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
