  :root {
    --bg: #0E1012; --panel: #171A1E; --panel2: #20242A; --nav: #121417; --field: #0A0C0E;
    --line: #262A30; --line2: #33383F; --fg: #ECEEF1; --fg2: #C9CED6; --muted: #9AA1AB; --dim: #5E656E;
    --acc: #F5A524; --acc-ink: #1A1300; --acc-soft: rgba(245,165,36,.14); --ok: #46C37B; --ok-line: #2C5B40;
    --bad: #FF6B5E; --bad-soft: #FF8A7E; --bad-line: #5A2E2A; --bad-bg: #1E1416;
    --glass: rgba(14,16,18,.86); --glass-line: rgba(255,255,255,.12);
    --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); }
  .ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ic.s { width: 18px; height: 18px; }
  .ic.dots { fill: currentColor; stroke: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---- sign-in ---- */
  .login { max-width: 420px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; padding: 96px 24px calc(32px + env(safe-area-inset-bottom)); }
  .brand { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .logo { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: var(--acc); color: var(--acc-ink); }
  .logo .ic { width: 30px; height: 30px; stroke-width: 2; }
  .brand h1 { margin: 0; font-family: var(--mono); font-size: 30px; font-weight: 500; letter-spacing: -.01em; }
  .brand p { margin: 4px 0 0; font-size: 16px; color: var(--muted); }
  .idcard { margin-top: 40px; display: flex; align-items: center; gap: 12px; }
  .idcard .ic { width: 24px; height: 24px; stroke: var(--ok); }
  .idcard div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .idcard div span:first-child { font-weight: 500; }
  .idcard div span:last-child { font-size: 13px; color: var(--muted); }
  #loginForm { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
  #loginForm label { font-size: 14px; font-weight: 500; color: var(--fg2); }
  /* With a passkey registered it comes first; the password is the fallback below */
  .pklogin { margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }
  .pklogin .btn .ic { width: 22px; height: 22px; }
  .orline { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 13px; color: var(--muted); }
  .orline::before, .orline::after { content: ''; flex: 1; height: 1px; background: var(--line2); }
  .login.pk #loginForm { margin-top: 16px; }
  .login.pk #loginForm > label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .pwrow { position: relative; }
  .pwrow .field { padding-right: 52px; }
  .eye { position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: var(--muted); }
  .eye .slash { display: none; }
  .eye[aria-pressed="true"] .slash { display: inline; }
  .err { margin: 0; min-height: 20px; font-size: 14px; color: var(--bad); }
  .foot { margin: auto 0 0; padding-top: 24px; font-size: 13px; color: var(--muted); }
  .pairlink { margin-top: 14px; align-self: center; }
  #pairForm { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  #pairForm label { font-size: 14px; font-weight: 500; color: var(--fg2); }
  #pairCode { font-family: var(--mono); font-size: 22px; letter-spacing: .25em; text-align: center; }
  .pairhint { margin: 0; font-size: 13px; color: var(--muted); }

  /* ---- app shell ---- */
  #app { max-width: 760px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  /* Foreground window: a tap opens Windows */
  .fgbtn { flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; border: 1px solid var(--line2); border-radius: 12px; background: var(--panel); color: var(--fg); font-size: 14px; font-weight: 500; text-align: left; }
  .fgic { flex: none; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .fgic img { width: 20px; height: 20px; display: block; }
  .fgname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fgbtn .chev { width: 16px; height: 16px; stroke-width: 2; color: var(--muted); }
  .fglock { display: none; }
  .fgbtn.locked { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad-soft); }
  .fgbtn.locked .fgic { color: var(--bad-soft); }
  .fgbtn.locked .fglock { display: block; }
  .fgbtn.locked .fgwin, .fgbtn.locked #fgIcon { display: none !important; }
  /* Live view: HD / SD / paused */
  .live { flex: none; display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line2); }
  .live button { position: relative; min-width: 34px; height: 36px; padding: 0 5px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
  .live button .ic { width: 16px; height: 16px; stroke-width: 2.6; }
  .live button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }
  .live button[data-live="off"][aria-pressed="true"] { background: #2A2F36; color: var(--fg); }
  /* Dot before HD: green while live, red when paused or lagging; blinks while a frame loads */
  .livedot { flex: none; align-self: center; width: 8px; height: 8px; margin: 0 3px 0 6px; border-radius: 50%; background: var(--ok); }
  .livedot[data-state="off"], .livedot[data-state="late"] { background: var(--bad); }
  .livedot.busy { animation: pulse 1s ease-in-out infinite; }
  /* Invisible 44 px touch area on small buttons */
  .live button::after, .seg button::after { content: ''; position: absolute; inset: -6px -1px; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 12px 12px; overscroll-behavior: contain; }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  nav.tabs { flex: none; display: grid; grid-template-columns: repeat(7, minmax(max-content, 1fr)); gap: 2px; padding: 6px 6px calc(10px + env(safe-area-inset-bottom)); background: var(--nav); border-top: 1px solid #23272D; }
  nav.tabs button { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 500; }
  /* Color alone marks the tab in view: a bolder label would be wider and could be cut */
  nav.tabs button[aria-current="page"] { color: var(--acc); }
  nav.tabs button { min-width: 0; padding: 0 1px; }
  nav.tabs button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 360px) { nav.tabs button { font-size: 10.5px; } }

  /* ---- shared parts ---- */
  .card { padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .eyebrow { margin: 0; padding: 0 2px; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .btn { min-height: 48px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line2); border-radius: 12px; background: var(--panel2); color: var(--fg); font-size: 15px; font-weight: 500; }
  .btn.primary { border: 0; background: var(--acc); color: var(--acc-ink); font-weight: 600; }
  .btn.big { min-height: 52px; font-size: 16px; }
  .btn.sm { flex: none; min-height: 44px; min-width: 84px; padding: 0 14px; font-size: 14px; font-weight: 600; }
  .btn.danger { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad-soft); font-weight: 600; }
  .btn.armed { border-color: var(--bad); background: var(--bad); color: #2A0703; }
  .linkbtn { align-self: flex-start; min-height: 40px; padding: 0; border: 0; background: none; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .key { position: relative; min-height: 48px; padding: 0 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--fg); font-family: var(--mono); font-size: 14px; }
  .key.risky { border-color: var(--bad-line); color: var(--bad-soft); }
  .key.armed { border-color: var(--bad); background: var(--bad); color: #2A0703; font-family: inherit; font-size: 13px; font-weight: 600; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  /* Keep long key labels from overflowing on very narrow phones */
  @media (max-width: 340px) { .grid4 .key { font-size: 12px; } }
  .grid6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .grid6 .key { min-height: 44px; border-radius: 10px; font-size: 13px; }
  .field { width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 12px; background: var(--field); color: var(--fg); font-size: 16px; }
  textarea.field { padding: 12px 14px; line-height: 1.45; resize: vertical; }
  .label { font-size: 14px; font-weight: 500; color: var(--fg2); }
  .note { margin: 0; padding: 0 2px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .reshead { display: flex; align-items: baseline; gap: 8px; padding: 0 2px; }
  .reshead > :first-child { flex: 1; }
  .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .badge { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .badge.acc { border-color: var(--acc); color: var(--acc); }
  .badge.bad { border-color: var(--bad-line); color: var(--bad-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--fg2); font-family: var(--mono); font-size: 13px; }
  .seg { display: flex; gap: 3px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; }
  .seg button { position: relative; flex: 1; min-width: 0; min-height: 34px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg button[aria-pressed="true"] { background: #2A2F36; color: var(--fg); font-weight: 600; }
  #toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: min(92vw, 560px); padding: 10px 14px; border-radius: 12px; background: #2A2F36; color: var(--fg); font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.45); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; overflow-wrap: anywhere; }
  #toast.on { opacity: 1; }
  #toast.bad { color: var(--bad-soft); }
  @keyframes pulse { 50% { opacity: .2; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- screen ---- */
  #p-screen { gap: 10px; }
  /* Square corners: rounded ones would cut off the screen's corner pixels (e.g. the close button) */
  .view { position: relative; flex: none; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line); }
  .view:not(.loaded) { aspect-ratio: 16 / 9; }
  .stage { position: relative; }
  .stage .shot-img { display: block; width: 100%; height: auto; }
  .tap { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; background: transparent; cursor: crosshair; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  /* Quick mode: a ring where the finger tapped; filled while held (right-click or drag) */
  .qmark { position: absolute; z-index: 2; left: 0; top: 0; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 2px solid var(--acc); box-shadow: 0 0 0 1.5px rgba(0,0,0,.6); pointer-events: none; opacity: 0; }
  .qmark.tap { animation: qtap .45s ease-out; }
  .qmark.hold { opacity: 1; background: rgba(245,165,36,.2); transform: scale(1.15); }
  @keyframes qtap { from { opacity: 1; transform: scale(.55); } to { opacity: 0; transform: scale(1.35); } }
  .aim { position: absolute; z-index: 1; width: 26px; height: 26px; transform: translate(-50%, -50%); pointer-events: none; }
  .aim::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--acc); box-shadow: 0 0 0 1.5px rgba(0,0,0,.75), inset 0 0 0 1.5px rgba(0,0,0,.75); }
  .aim::after { content: ''; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 1px rgba(0,0,0,.8); }
  /* Action bar that appears next to the crosshair */
  .bubble { position: absolute; z-index: 4; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: calc(100% - 8px); padding: 3px; border-radius: 12px; background: var(--panel); box-shadow: 0 0 0 1px var(--line2), 0 6px 18px rgba(0,0,0,.55); }
  .bubble .grp { display: flex; gap: 2px; }
  .bubble .grp + .grp { padding-left: 3px; border-left: 1px solid var(--line2); }
  .bubble::before { content: ''; position: absolute; left: var(--ax, 50%); width: 10px; height: 10px; margin-left: -5px; background: var(--panel); transform: rotate(45deg); }
  .bubble.above::before { bottom: -5px; box-shadow: 1px 1px 0 0 var(--line2); }
  .bubble.below::before { top: -5px; box-shadow: -1px -1px 0 0 var(--line2); }
  .bubble button { position: relative; min-height: 40px; min-width: 42px; padding: 0 8px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 9px; background: transparent; color: var(--fg); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .bubble button .ic { width: 18px; height: 18px; stroke-width: 2.2; }
  .bubble button.pri { background: var(--acc); color: var(--acc-ink); }
  .bubble button.x { color: var(--muted); }
  /* Choosing a target for a macro: only Choose and the cross */
  .bubble.picking .acts, .bubble:not(.picking) #pickBtn { display: none; }
  .bubble.picking .grp:last-child { padding-left: 0; border-left: 0; }
  .toolbar { flex: none; display: flex; align-items: center; gap: 8px; }
  .toolbar .seg { flex: 1; }
  .toolbar .seg button { min-height: 32px; }
  .tool { flex: none; height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px 0 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); color: var(--muted); font-size: 13px; font-weight: 500; }
  .tool.sq { width: 40px; padding: 0; color: var(--fg); }
  .tool .ic { width: 18px; height: 18px; stroke-width: 2; }
  .knob { position: relative; flex: none; width: 32px; height: 20px; border-radius: 999px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line2); }
  .knob::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
  .tool[aria-checked="true"] { color: var(--fg); }
  .tool[aria-checked="true"] .knob { background: var(--acc); box-shadow: none; }
  .tool[aria-checked="true"] .knob::after { transform: translateX(12px); background: var(--acc-ink); }
  .tool[aria-pressed="true"] { border-color: var(--acc); background: var(--acc-soft); color: var(--acc); }
  /* Target strip: fixed height, so the buttons below do not move when aiming */

    nav.tabs button { flex: none; min-height: 62px; }
    #p-screen { display: grid; grid-template-columns: minmax(0, 330px) minmax(180px, 1fr) minmax(0, 330px); grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px 10px; }

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// ---------- language ----------

// The server picks the language (the one chosen under More, else the phone's) and embeds its texts here.
const I18N = JSON.parse($('#i18n').textContent);
const PLURAL = new Intl.PluralRules(I18N.lang);
// Text for a key; {name} placeholders come from `args`, a plural value is chosen by args.n.
function t(key, args) {
  let s = I18N.dict[key];
  if (s && typeof s === 'object') s = s[PLURAL.select(args && args.n != null ? args.n : 0)] || s.other;
  if (typeof s !== 'string') return key;
  return args ? s.replace(/\{(\w+)\}/g, (m, k) => k in args ? argText(k, args[k]) : m) : s;
}
function argText(k, v) { return v && typeof v === 'object' ? tm(v) : k === 'combo' ? prettyCombo(v) : String(v); }
// A message from the server (log entry, error): a key and its arguments
function tm(m) { return m && m.code ? t(m.code, m.args) : ''; }
function kindName(k) { const key = 'kind.' + k.replace(/ /g, '_'); return key in I18N.dict ? t(key) : k; }
function prettyCombo(c) {
  return c.split('+').map(k => {
    const v = I18N.dict['key.' + k];
    return typeof v === 'string' ? v : k.length === 1 ? k.toUpperCase() : k.charAt(0).toUpperCase() + k.slice(1);
  }).join('+');
}
// Fixed texts of the page; key buttons without a label show their key combination
function applyI18n() {
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $$('[data-i18n-label]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nLabel)));
  $$('[data-k], [data-mod]').forEach(b => { if (!b.textContent.trim() && !b.children.length) b.textContent = prettyCombo(b.dataset.k || b.dataset.mod); });
}
applyI18n();

// Small preferences for this browser only; defaults apply if they cannot be read.
const store = {
  get(k, d) { try { const v = localStorage.getItem('strcu.' + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('strcu.' + k, JSON.stringify(v)); } catch (_) {} },
};

const S = {
  scr: null,            // area covered by the last screenshot (physical pixels)
  shotAt: 0,
  view: store.get('view', 'screen'),
  // Live view: 'hd' | 'sd' | 'off'. HD is not remembered; the page starts with SD (or paused) so a
  // forgotten HD view does not eat mobile data.
  mode: store.get('live', true) ? 'sd' : 'off',
  quick: store.get('quick', false),
  recent: store.get('recent', ['ctrl+shift+esc', 'win+r', 'ctrl+l']),
  aim: null, aimSeq: 0, target: null,
  status: null, me: null, tab: 'screen', fgHwnd: undefined,
  els: null, elKind: 'all',
  aimNext: null,        // crosshair to place on the next frame after a view change
  wl: store.get('wl', 'open'), apps: null, appRecent: store.get('appRecent', []),
  refreshing: false, again: false, liveReq: null, timer: null,
  mods: new Set(),      // modifier keys selected on Keyboard (one-shot)
  typeInto: '',         // name of the box picked with Type on Elements
  fs: false, fsAuto: false, fsReal: false,
  // Macros: the list, the one being edited (a copy; saved with Save), what runs or records now, a target being picked
  mac: { list: null, now: '', state: { running: null, recording: null }, edit: null, dirty: false, open: -1, adding: false, pick: null, polled: 0 },
};

const LOUPE = 96;       // area shown in the target strip magnifier (physical pixels)
// HD does not scale down (the server never scales up; 4096 is only a ceiling); SD scales the long side to 1280.
// Frames taken while paused (startup, view change) are SD.
const QUALITY = { hd: { max: 4096, q: 85 }, sd: { max: 1280, q: 70 } };
// Kind filters on the Elements tab and the order in the list
const GROUP = { 'list item': 'list', 'data item': 'list', 'button': 'button', 'checkbox': 'button', 'radio button': 'button', 'dropdown': 'button', 'tree item': 'nav', 'tab': 'nav', 'link': 'nav', 'menu item': 'nav', 'text field': 'text' };
const GROUPS = ['all', 'list', 'button', 'nav', 'text'];
const ORDER = { list: 0, text: 1, nav: 2, button: 3 };
// The window's title bar buttons (Windows and browsers, Turkish and English); moved to the end of the list
const CAPTION = new Set(['minimize', 'minimise', 'maximize', 'maximise', 'restore', 'restore down', 'close', 'simge durumuna kucult', 'ekrani kapla', 'onceki boyut', 'asagi geri getir', 'geri yukle', 'kapat', 'kucult', 'buyut', 'en aza indir', 'en buyuk duruma getir']);
const MODS = ['ctrl', 'alt', 'shift', 'win'];
const OFF_SECS = 15;    // SHUTDOWN_SECS on the server
const ICON = {
  cross: 'M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0M12 2v4M12 18v4M2 12h4M18 12h4',
  max: 'M9 4H4v5M15 4h5v5M20 15v5h-5M4 15v5h5',
  close: 'M6 6l12 12M18 6L6 18',
  lock: 'M7 11h10a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2zM8 11V8a4 4 0 0 1 8 0v3',
  check: 'M5 12l5 5 9-10',
  play: 'M8 5v14l11-7z',
  stop: 'M7 7h10v10H7z',
  clock: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',
  back: 'M15 5l-7 7 7 7',
  up: 'M6 15l6-6 6 6',
  down: 'M6 9l6 6 6-6',
  copy: 'M9 9h10v10H9zM5 15V5h10',
  trash: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
  plus: 'M12 5v14M5 12h14',
  finger: 'M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4M14 13.12c0 2.38 0 6.38-1 8.88M17.29 21.02c.12-.6.43-2.3.5-3.02M2 12a10 10 0 0 1 18-6M2 16h.01M21.8 16c.2-2 .131-5.354 0-6M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2M8.65 22c.21-.66.45-1.32.57-2M9 6.8a6 6 0 0 1 9 5.2v2',
};

// Safe DOM builder: text from the server always goes in as textContent.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c);
  return el;
}

function svgIcon(d, cls, label) {
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', cls || 'ic');
  if (label) { s.setAttribute('role', 'img'); s.setAttribute('aria-label', label); } else s.setAttribute('aria-hidden', 'true');
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); s.append(p);
  return s;
}

function toast(msg, bad) {
  const el = $('#toast');
  el.textContent = msg; el.classList.toggle('bad', !!bad); el.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2800);
}
function busy(on) { $$('.livedot').forEach(d => d.classList.toggle('busy', on)); }

function authError() { const e = new Error(t('err.signin_required')); e.auth = true; return e; }

// Clicking or typing from the panel while a macro runs would mix with its steps: ask to stop it first
const INPUT_PATHS = new Set(['/api/click', '/api/type', '/api/key', '/api/scroll', '/api/live', '/api/hold', '/api/focus', '/api/close', '/api/launch', '/api/lock', '/api/shutdown']);

async function api(path, body) {
  if (INPUT_PATHS.has(path) && S.mac.state.running) {
    if (!(await ask(t('mac.ask_stop', { name: S.mac.state.running.name }), t('mac.ask_stop_yes')))) throw new Error(t('mac.not_done'));
    try { await api('/api/macros/stop', {}); } catch (_) {}
    S.mac.state.running = null; renderMacBar();
  }
  const opt = body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const data = (r.headers.get('content-type') || '').includes('json') ? await r.json() : null;
  if (r.status === 401 && path !== '/api/login' && path !== '/api/passkey/login') { showLogin(); throw authError(); }
  if (!r.ok) throw new Error(data && data.error ? tm(data.error) : 'HTTP ' + r.status);
  return data;
}

async function fetchShot(params, signal) {
  const r = await fetch('/api/shot?' + new URLSearchParams(params), { cache: 'no-store', signal });
  if (r.status === 401) { showLogin(); throw authError(); }
  if (!r.ok) throw new Error(t('err.shot'));
  const n = k => +r.headers.get('x-screen-' + k);
  return { area: { x: n('x'), y: n('y'), w: n('w'), h: n('h') }, blob: await r.blob() };
}

// A picture ready to draw: a JPEG from the computer (or, in tests, any image)
async function decodePic(blob) {
  if (window.createImageBitmap) { try { return await createImageBitmap(blob); } catch (_) {} }
  const url = URL.createObjectURL(blob), img = new Image();
  img.src = url;
  try { await img.decode(); } finally { URL.revokeObjectURL(url); }
  return img;
}

// Draws pieces into the screen picture (both canvases: the Screen tab's and full screen's). `w`×`h` is the
// picture's size, `area` the part of the screen it shows; a new size starts a new picture.
function paint(area, w, h, parts) {
  let resized = false;
  for (const c of $$('.shot-img')) {
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; resized = true; }
    const g = c.getContext('2d');
    for (const p of parts) g.drawImage(p.pic, p.x, p.y, p.w, p.h);
  }
  const a = S.scr, moved = !a || a.x !== area.x || a.y !== area.y || a.w !== area.w || a.h !== area.h;
  S.scr = area; S.shotAt = Date.now();
  $('#view').classList.add('loaded');
  // On tablets the image box is sized from the shape of the frame (full screen or a window)
  $('#view').style.setProperty('--ar', (area.w / area.h).toFixed(4));
  if (resized || moved) {
    // Full screen fits a picture of another shape again (the view changed between full screen and window)
    const c = $('#fsImg');
    if (S.fs && Math.abs(c.width / c.height - Z.bw / Z.bh) > 0.01) fsLayout(true); else placeAim();
  }
  if (S.aimNext) { const p = S.aimNext; S.aimNext = null; setAim(p); }
  renderLiveDot();
}

// Show the result of an action: refresh the screen (unless paused) and the foreground window
function after(ms) { setTimeout(() => { refresh(); status(); }, ms || 450); }

// Search ignores case and Turkish letter differences (ş=s, ı=i ...)
function fold(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ı/g, 'i'); }
function hhmm(ms) { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

// ---------- sign-in ----------

function showLogin() {
  stopLive(); exitFs();
  $('#app').hidden = true; $('#login').hidden = false;
  // With a passkey registered, keep the keyboard closed; prepare the challenge for the phone's prompt in advance
  refreshMe().then(() => { if (pkReady()) pkPrepare('login'); else $('#pw').focus(); });
}
function showApp() { $('#login').hidden = true; $('#app').hidden = false; }

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  try {
    await api('/api/login', { password: $('#pw').value });
    $('#pw').value = ''; showPassword(false);
    start();
  } catch (err) { $('#loginErr').textContent = err.message; }
});

// ---------- pairing with the code shown on the computer ----------

async function pairWith(code) { await api('/api/pair', { code, name: deviceName() }); }

function showPair(err) {
  $('#pairLink').hidden = true; $('#pairForm').hidden = false;
  $('#pairErr').textContent = err || '';
  $('#pairCode').focus();
}
$('#pairLink').onclick = () => showPair();
$('#pairForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#pairErr').textContent = '';
  try { await pairWith($('#pairCode').value); $('#pairCode').value = ''; start(); }
  catch (err) { $('#pairErr').textContent = err.message; }
});

function showPassword(on) {
  $('#pw').type = on ? 'text' : 'password';
  $('#pwEye').setAttribute('aria-pressed', String(on));
  $('#pwEye').setAttribute('aria-label', on ? t('login.hide_password') : t('login.show_password'));
}
$('#pwEye').onclick = () => { showPassword($('#pw').type === 'password'); $('#pw').focus(); };

async function refreshMe() {
  try { S.me = await (await fetch('/api/me')).json(); } catch (_) { S.me = S.me || { email: null }; }
  renderMe();
}

function renderMe() {
  const email = S.me && S.me.email;
  $('#meCard').hidden = !email;
  $('#meEmail').textContent = email || '';
  const pk = pkReady();
  $('#pkLogin').hidden = !pk;
  $('#login').classList.toggle('pk', pk);
  $('#loginSubmit').classList.toggle('primary', !pk);
}

// ---------- passkey sign-in ----------

const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const PK_OK = !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
// Face ID on iPhone and iPad (Touch ID on older ones), fingerprint elsewhere
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
$('#pkLbl').textContent = IOS ? t('login.pk_faceid') : t('login.pk_fingerprint');

function pkReady() { return PK_OK && !!(S.me && S.me.passkey); }

// The phone's passkey prompt only opens on a direct tap (Safari): fetch the challenge before the tap.
const PK = { login: null, register: null };
const PK_PATH = { login: '/api/passkey/login/start', register: '/api/passkey/register/start' };
async function pkPrepare(kind) {
  try { PK[kind] = { o: await api(PK_PATH[kind], {}), at: Date.now() }; } catch (_) { PK[kind] = null; }
}
// The prepared challenge if still fresh, else a new one (valid 2 min on the server; each is single-use)
async function pkOptions(kind) {
  const c = PK[kind]; PK[kind] = null;
  return c && Date.now() - c.at < 90000 ? c.o : api(PK_PATH[kind], {});
}
// Refresh the challenge while the sign-in screen stays open
setInterval(() => { if (!$('#login').hidden && !document.hidden && pkReady()) pkPrepare('login'); }, 80000);

function pkError(e) {
  switch (e && e.name) {
    case 'NotAllowedError': return t('pk.err_not_allowed');
    case 'AbortError': return t('pk.err_abort');
    case 'InvalidStateError': return t('err.pk_exists');
    case 'NotSupportedError': return t('pk.err_unsupported');
    case 'SecurityError': return t('err.pk_no_site');
  }
  return (e && e.message) || t('pk.err_generic');
}

$('#pkBtn').onclick = async () => {
  const btn = $('#pkBtn');
  $('#loginErr').textContent = '';
  btn.disabled = true;
  try {
    const o = await pkOptions('login');
    let cred;
    try {
      cred = await navigator.credentials.get({ publicKey: {
        challenge: b64d(o.challenge), rpId: o.rp_id, timeout: o.timeout, userVerification: 'required',
        allowCredentials: o.allow.map(id => ({ type: 'public-key', id: b64d(id) })),
      } });
    } catch (e) { throw new Error(pkError(e)); }
    const r = cred.response;
    await api('/api/passkey/login', { id: b64e(cred.rawId), client_data: b64e(r.clientDataJSON), auth_data: b64e(r.authenticatorData), signature: b64e(r.signature) });
    start();
  } catch (e) {
    $('#loginErr').textContent = e.message;
    pkPrepare('login');   // for the next tap
  } finally { btn.disabled = false; }
};

// Name shown in the list: "Android · Chrome", "iPhone · Safari"
function deviceName() {
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || IOS ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : t('pk.device');
  const br = /EdgA?\/|EdgiOS/.test(ua) ? 'Edge' : /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /FxiOS|Firefox\//.test(ua) ? 'Firefox'
    : /CriOS|Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return br ? os + ' · ' + br : os;
}

        challenge: b64d(o.challenge), rp: o.rp, timeout: o.timeout, attestation: 'none',
        user: { id: b64d(o.user.id), name: o.user.name, displayName: o.user.display_name },

        excludeCredentials: o.exclude.map(id => ({ type: 'public-key', id: b64d(id) })),

// ---------- screenshot and status ----------

// Frames are taken only while visible: the Screen tab or full screen.
function onScreen() { return S.tab === 'screen' || S.fs; }

// One request at a time: frames do not pile up on a slow network. `why`:
//   'live'   live frame from the timer; cancelled when the mode changes, so no frame lands after pausing
//   'urgent' startup, quality or view changed; a new request follows as soon as the running one ends
//   (none)   a single frame after an action (to show the result); not taken while paused, the image stays frozen
async function refresh(why) {
  if (streamOn()) return;
  if (!why && (S.mode === 'off' || !onScreen())) return;
  if (why === 'live' && !onScreen()) return;
  if (S.refreshing) { if (why === 'urgent') S.again = true; return; }
  S.refreshing = true; busy(true);
  const ctl = why === 'live' ? (S.liveReq = new AbortController()) : null;
  const view = S.view;
  try {
    const s = await fetchShot({ ...(QUALITY[S.mode] || QUALITY.sd), view }, ctl && ctl.signal);
    const pic = await decodePic(s.blob);
    // If cancelled, or the view changed while the request was in flight, the frame is not shown (a new one is
    // requested); nor once the stream has taken over
    if ((ctl && ctl.signal.aborted) || view !== S.view || streamOn()) {
      if (view !== S.view) S.again = true;
      return;
    }
    const w = pic.naturalWidth || pic.width, h = pic.naturalHeight || pic.height;
    paint(s.area, w, h, [{ x: 0, y: 0, w, h, pic }]);
    if (pic.close) pic.close();
    if (why) status();
  } catch (e) {
    S.aimNext = null;
    if (e.name !== 'AbortError' && !e.auth) toast(e.message, true);
  } finally {
    S.refreshing = false; S.liveReq = null; busy(false);
    if (S.again) { S.again = false; refresh('urgent'); }
  }
}

async function status() {
  try {
    S.status = await api('/api/status');
    renderFg(); renderQtPlaceholder();
    syncShutdown(S.status.shutdown_in);
    renderSession();

}

// Dot next to HD / SD: its color shows the state, its title the details (and the frame's time when paused or lagging)
function renderLiveDot() {
  let text, state;
  if (S.mode === 'off') { text = t('live.paused') + (S.shotAt ? ' · ' + hhmm(S.shotAt) : ''); state = 'off'; }
  else if (S.shotAt && Date.now() - S.shotAt > 10000) { text = t('live.late') + ' · ' + hhmm(S.shotAt); state = 'late'; }
  else { text = t('live.on') + ' · ' + S.mode.toUpperCase(); state = 'on'; }
  $$('.livedot').forEach(d => { d.dataset.state = state; d.title = text; });
}
setInterval(renderLiveDot, 2000);

function renderLive() {
  $$('[data-live]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.live === S.mode)));
  renderLiveDot();
}
// While live the picture comes as a stream; the foreground window is followed every 2.5 s. Without the
// stream, frames are fetched on the same timer. While the screen is hidden (another tab) no frames are taken.
function startLive() {
  clearInterval(S.timer);
  if (S.mode === 'off') streamStop();
  else if (LV.ws) streamCfg();    // HD ↔ SD: a whole new picture in the new quality
  else streamStart();
  S.timer = S.mode === 'off' ? null : setInterval(() => {
    if (document.hidden || $('#app').hidden) return;
    if (onScreen() && !streamOn()) refresh('live'); else status();
  }, 2500);
  renderLive();
}
function stopLive() { clearInterval(S.timer); S.timer = null; streamStop(); }

// ---------- live view stream ----------
// The computer sends only what changed on the screen (see stream.rs); each frame is acknowledged once drawn,
// so a slow network gets fewer frames instead of a growing delay. If the connection cannot be made three
// times in a row (an old browser, a proxy in the way), frames are fetched every 2.5 s as before.
const LV = { ws: null, open: false, fails: 0, poll: typeof WebSocket !== 'function', chain: Promise.resolve(), retry: 0 };

function streamOn() { return !!LV.ws; }

function streamStart() {
  if (LV.poll || LV.ws || S.mode === 'off' || $('#app').hidden) return;
  clearTimeout(LV.retry);
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/stream');
  ws.binaryType = 'arraybuffer';
  LV.ws = ws; LV.open = false;
  ws.onopen = () => { LV.open = true; LV.fails = 0; streamCfg(); streamVisible(); };
  ws.onmessage = e => {
    if (typeof e.data !== 'string') { LV.chain = LV.chain.then(() => streamFrame(ws, e.data)); return; }
    // "same": the picture is the screen as it is now
    if (e.data.includes('"same"')) { S.shotAt = Date.now(); renderLiveDot(); }
  };
  ws.onclose = () => {
    if (LV.ws !== ws) return;
    const opened = LV.open;
    LV.ws = null; LV.open = false;
    if (!opened && ++LV.fails >= 3) { LV.poll = true; startLive(); return; }
    // Turned away before opening: if the session has ended, this shows the sign-in screen
    if (!opened) status();
    if (S.mode !== 'off' && !$('#app').hidden) LV.retry = setTimeout(streamStart, opened ? 500 : 2000);
  };
}
function streamStop() {
  clearTimeout(LV.retry);
  const ws = LV.ws;
  LV.ws = null; LV.open = false;
  if (ws) ws.close();
}
function streamSend(m) { if (LV.open && LV.ws.readyState === 1) LV.ws.send(JSON.stringify(m)); }
function streamCfg() { streamSend({ t: 'cfg', q: S.mode, view: S.view }); }
// Frames only while the picture is in view; the connection stays, so coming back needs no whole new picture
function streamVisible() {
  if (LV.ws) streamSend({ t: onScreen() && !document.hidden ? 'go' : 'pause' });
  else if (!document.hidden && S.timer) streamStart();
}
// A new picture after the view changed (or to aim at something outside the current one)
function newPicture() { if (streamOn()) streamCfg(); else refresh('urgent'); }

async function streamFrame(ws, buf) {
  try {
    const n = new DataView(buf).getUint32(0, true);
    const hd = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n)));
    let off = 4 + n;
    const parts = hd.r.map(([x, y, w, h, len]) => {
      const p = { x, y, w, h, blob: new Blob([new Uint8Array(buf, off, len)], { type: 'image/jpeg' }) };
      off += len;
      return p;
    });
    const pics = await Promise.all(parts.map(p => decodePic(p.blob)));
    if (ws === LV.ws) paint(hd.area, hd.w, hd.h, parts.map((p, i) => ({ ...p, pic: pics[i] })));
    pics.forEach(p => { if (p.close) p.close(); });
  } catch (_) {
    // A piece that cannot be drawn leaves the picture incomplete: ask for all of it again
    streamSend({ t: 'key' });
  } finally {
    if (ws === LV.ws && ws.readyState === 1) ws.send('{"t":"ack"}');
  }
}

// When pausing, the last frame (HD if it was HD) stays in place: the live frame in flight is cancelled.
// Switching HD ↔ SD does not wait for a frame in the old quality either.
$$('[data-live]').forEach(b => b.onclick = () => {
  if (S.mode === b.dataset.live) return;
  S.mode = b.dataset.live; store.set('live', S.mode !== 'off');
  if (S.liveReq) S.liveReq.abort();
  startLive();
  if (S.mode === 'off') S.again = false;
  else if (!streamOn()) refresh('urgent');
});
// A fresh frame on returning to the panel; when paused the image stays as it is
document.addEventListener('visibilitychange', () => {
  if ($('#app').hidden) return;
  if (S.mode !== 'off') streamVisible();
  if (!document.hidden) { refresh(); status(); }
});

function renderView() {
  $$('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
}
$$('[data-view]').forEach(b => b.onclick = () => {
  if (S.view === b.dataset.view) return;
  S.view = b.dataset.view; store.set('view', S.view); renderView(); newPicture();
});

// ---------- aim, then choose ----------

$('#tap').addEventListener('click', ev => {
  if (quickOn()) return;   // quick mode reads the touches itself (see quickGestures)
  const b = $('#shot').getBoundingClientRect();
  tapAt((ev.clientX - b.left) / b.width, (ev.clientY - b.top) / b.height);
});

// Relative point on the image (0..1): clicked in quick-tap mode, otherwise aimed at
function tapAt(fx, fy) {
  if (!S.scr || !(fx >= 0 && fy >= 0 && fx <= 1 && fy <= 1)) return;
  const p = { x: Math.min(S.scr.x + S.scr.w - 1, Math.round(S.scr.x + fx * S.scr.w)), y: Math.min(S.scr.y + S.scr.h - 1, Math.round(S.scr.y + fy * S.scr.h)) };
  if (S.quick && !S.mac.pick) act('click', p); else setAim(p);
}

// The crosshair and bar follow where the image currently is (it may be zoomed in full screen)
function placeAim() {
  const a = $('#aim'), bub = $('#bubble');
  if (!S.aim || !S.scr) { a.hidden = bub.hidden = true; return; }
  const fx = (S.aim.x - S.scr.x) / S.scr.w, fy = (S.aim.y - S.scr.y) / S.scr.h;
  // A crosshair left outside the image (e.g. after switching to the "Pencere" view) is removed, not left without a bar
  if (fx < 0 || fy < 0 || fx > 1 || fy > 1) { clearAim(); return; }
  const host = S.fs ? $('#fs') : $('#view .stage');
  const ir = (S.fs ? $('#fsImg') : $('#shot')).getBoundingClientRect(), hr = host.getBoundingClientRect();
  if (!ir.width || !hr.width) return;     // not visible (another tab); placed on return
  const ax = ir.left - hr.left + fx * ir.width, ay = ir.top - hr.top + fy * ir.height;
  // When zoomed in full screen the crosshair may fall outside the view; it stays, only the marker is hidden
  if (ax < 0 || ay < 0 || ax > hr.width || ay > hr.height) { a.hidden = bub.hidden = true; return; }
  a.hidden = bub.hidden = false;
  a.style.left = ax + 'px'; a.style.top = ay + 'px';
  placeBubble(ax, ay, hr.width, hr.height);
}

// The bar sits above the crosshair, below if there is no room; tapping outside the bar moves the crosshair there.
function placeBubble(ax, ay, W, H) {
  const bub = $('#bubble');
  bub.style.left = '0px';   // so the previous position does not narrow the bar and wrap it onto two lines
  const bw = bub.offsetWidth, bh = bub.offsetHeight, gap = 20;
  const left = Math.max(4, Math.min(W - bw - 4, ax - bw / 2));
  const above = ay - gap - bh >= 4;
  bub.style.left = left + 'px';
  bub.style.top = (above ? ay - gap - bh : Math.min(ay + gap, H - bh - 4)) + 'px';
  bub.style.setProperty('--ax', Math.max(12, Math.min(bw - 12, ax - left)) + 'px');
  bub.classList.toggle('above', above); bub.classList.toggle('below', !above);
}
window.addEventListener('resize', () => { if (S.fs) fsLayout(false); else placeAim(); });

function setAim(p) {
  S.aim = p; S.target = null; S.typeInto = ''; renderQtPlaceholder();
  const seq = ++S.aimSeq;
  placeAim();
  renderTarget('loading');
  loadLoupe(p, seq);
  api('/api/target?x=' + p.x + '&y=' + p.y).then(el => {
    if (seq !== S.aimSeq) return;
    S.target = el && { ...el, kind: kindName(el.kind), source: el.source === 'taskbar' ? t('target.taskbar') : el.source };
    renderTarget();
  }).catch(() => { if (seq === S.aimSeq) renderTarget('error'); });
}

// Target strip (and the target label in full screen). Always the same height: the layout does not shift when aiming.
function renderTarget(state) {
  const has = !!S.aim;
  let name, kind;
  if (!has) {
    name = S.quick ? t('target.quick') : t('target.idle');
    kind = S.quick ? t('target.quick_sub') : t('target.idle_sub');
  } else if (state === 'loading') { name = '…'; kind = 'x ' + S.aim.x + ' · y ' + S.aim.y; }
  else if (state === 'error') { name = t('target.error'); kind = ''; }
  else if (S.target) { name = S.target.name; kind = [S.target.kind, S.target.source].filter(Boolean).join(' · '); }
  else { name = t('target.unnamed'); kind = t('target.unnamed_sub'); }
  $('#tstrip').classList.toggle('idle', !has);
  $('#tName').textContent = name; $('#tKind').textContent = kind;
  $('#tstrip').setAttribute('aria-label', has ? t('target.label', { name }) + (kind ? ', ' + kind : '') : name);
  $('#fsTarget').hidden = !has;
  $('#fsTName').textContent = name;
  $('#fsTKind').textContent = has && S.target ? S.target.kind : '';
}
// A long name is cut in the strip; a tap shows all of it
$('#tstrip').onclick = $('#fsTarget').onclick = () => {
  if (S.aim && S.target) toast(S.target.name + (S.target.kind ? ' · ' + S.target.kind : ''));
  else if (!S.aim && quickOn()) toast(t('target.quick_sub'));
};

async function loadLoupe(p, seq) {
  try {
    const s = await fetchShot({ rx: p.x - LOUPE / 2, ry: p.y - LOUPE / 2, rw: LOUPE, rh: LOUPE, q: 85 });
    if (seq !== S.aimSeq) return;
    const img = $('#loupe'), old = img.src;
    // In percent of the magnifier, which is larger on tablets
    const k = 100 / LOUPE;
    // The region shrinks when clipped at the screen edge; keep the target centred in the magnifier
    img.style.left = ((s.area.x - (p.x - LOUPE / 2)) * k) + '%';
    img.style.top = ((s.area.y - (p.y - LOUPE / 2)) * k) + '%';
    img.style.width = (s.area.w * k) + '%';
    img.style.height = (s.area.h * k) + '%';
    img.src = URL.createObjectURL(s.blob);
    if (old.startsWith('blob:')) URL.revokeObjectURL(old);
  } catch (_) {}
}

function clearAim() {
  S.aim = null; S.target = null; S.aimSeq++;
  placeAim(); renderTarget();
}
$('#clearAim').onclick = clearAim;

async function act(kind, p) {
  p = p || S.aim;
  if (!p) return;
  const name = p === S.aim && S.target ? S.target.name : '';
  const scroll = kind === 'up' || kind === 'down';
  try {
    if (scroll) await api('/api/scroll', { x: p.x, y: p.y, notches: kind === 'up' ? 5 : -5 });
    else await api('/api/click', { x: p.x, y: p.y, button: kind === 'right' ? 'right' : 'left', count: kind === 'double' ? 2 : 1, label: name || undefined });
    toast(t('act.done_' + kind) + (name ? ' · ' + name : ''));
  } catch (e) { toast(e.message, true); return; }
  if (scroll) {
    // The crosshair stays so scrolling can be repeated
    setTimeout(() => { refresh(); if (S.aim && S.mode !== 'off') loadLoupe(S.aim, S.aimSeq); }, 450);
  } else {
    clearAim();
    after();
  }
}
$$('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));

// Types the text into the foreground window (the phone keyboard's Enter only submits; there is a separate Enter key)
async function sendText(text, enter) {
  const where = S.typeInto || (S.status && S.status.foreground) || t('screen.fg_window');
  try {
    if (text) await api('/api/type', { text, enter }); else await api('/api/key', { combo: 'enter' });
    const n = [...text].length;
    toast(!n ? t('toast.enter_sent', { where }) : enter ? t('toast.typed_enter', { n, where }) : t('toast.typed', { n, where }));
    S.typeInto = ''; renderQtPlaceholder();
    after();
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

$('#qtForm').addEventListener('submit', async e => {
  e.preventDefault();
  const inp = $('#qt');
  if (!inp.value) { inp.focus(); return; }
  if (await sendText(inp.value, false)) { liveReset(inp); inp.blur(); }
});

// ---------- quick mode ----------

// Keys typed live and a held drag go out one request at a time, in order. What piles up while one is on its
// way goes together: typed letters join, drag moves keep only the newest.
const LQ = { ops: [], busy: false, broken: false, t: 0 };
function liveSend(op) {
  const last = LQ.ops[LQ.ops.length - 1];
  if (last && op.hold === 'move' && last.hold === 'move') LQ.ops[LQ.ops.length - 1] = op;
  else if (last && op.type && last.type && !last.enter) {
    const chars = [...last.text], take = Math.min(op.back, chars.length);
    last.back += op.back - take;
    last.text = chars.slice(0, chars.length - take).join('') + op.text;
    last.enter = op.enter;
  } else LQ.ops.push(op);
  if (!LQ.busy) pumpLive();
}
async function pumpLive() {
  LQ.busy = true;
  while (LQ.ops.length) {
    const op = LQ.ops.shift();
    try {
      if (op.type) await api('/api/live', { back: op.back, text: op.text, enter: op.enter });
      else if (op.key) await api('/api/key', { combo: op.key });
      else {
        // After a failed press the rest of that drag is not sent
        if (op.hold === 'down') LQ.broken = false; else if (LQ.broken) continue;
        await api('/api/hold', { do: op.hold, x: op.x, y: op.y });
      }
    } catch (e) {
      if (op.hold) LQ.broken = true;
      // Keys typed after a failure are dropped rather than arriving with a gap
      LQ.ops = LQ.ops.filter(o => o.hold);
      if (!e.auth) toast(e.message, true);
    }
  }
  LQ.busy = false;
  clearTimeout(LQ.t);
  LQ.t = setTimeout(() => { refresh(); status(); }, 400);
}

// Live typing: in quick mode the keyboard button opens the phone keyboard on a box nobody sees, which only
// catches keys. Each change is sent as Backspaces for what went away and the new letters, so the phone
// keyboard's corrections and suggestions come out right on the computer.
const QK = $('#qk');
QK._prev = '';
function liveReset(inp) { inp.value = ''; inp._prev = ''; }
function liveEnter(inp) { liveSend({ type: true, back: 0, text: '', enter: true }); liveReset(inp); }
const LIVE_KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Tab: 'tab', Delete: 'delete', Insert: 'insert', Escape: 'esc', Home: 'home', End: 'end', PageUp: 'pageup', PageDown: 'pagedown' };
// Apple keyboards type characters such as @ with Option: there Option and a key is text, not a shortcut
const APPLE = /Mac|iP(hone|ad|od)/.test(navigator.platform);
// A key that is not text, as a combo for the computer (arrows, Tab, F5, Ctrl+C, Shift+Enter ...); null for text
function keyCombo(e) {
  // AltGr (Ctrl and Alt together on Windows) types characters such as @ on many layouts
  const altGr = e.getModifierState && e.getModifierState('AltGraph');
  const ctrl = e.ctrlKey && !altGr, alt = e.altKey && !altGr, mod = ctrl || e.metaKey || (alt && !APPLE);
  let k = LIVE_KEYS[e.key] || (/^F([1-9]|1\d|2[0-4])$/.test(e.key) ? e.key.toLowerCase() : '');
  if (!k && e.key === 'Enter' && (mod || alt || e.shiftKey)) k = 'enter';
  if (!k && e.key === 'Backspace' && (mod || alt)) k = 'backspace';
  // With Ctrl ... the key's place on the keyboard counts, so Ctrl+Shift+S is S and not the shifted character
  if (!k && mod) k = /^(Key[A-Z]|Digit\d)$/.test(e.code) ? e.code.slice(-1).toLowerCase() : e.key === ' ' ? 'space' : [...e.key].length === 1 ? e.key.toLowerCase() : '';
  if (!k) return null;
  return [ctrl && 'ctrl', alt && 'alt', e.shiftKey && 'shift', e.metaKey && 'win'].filter(Boolean).concat(k).join('+');
}
QK.addEventListener('input', () => {
  const prev = [...QK._prev], cur = [...QK.value];
  let same = 0;
  while (same < prev.length && same < cur.length && prev[same] === cur[same]) same++;
  const back = prev.length - same, text = cur.slice(same).join('');
  QK._prev = QK.value;
  if (S.quick && (back || text)) liveSend({ type: true, back, text, enter: false });
});
QK.addEventListener('keydown', e => {
  if (!S.quick || e.isComposing || e.keyCode === 229) return;
  // Nothing left in the box: Backspace still deletes on the computer
  if (e.key === 'Backspace' && !QK.value) { e.preventDefault(); liveSend({ type: true, back: 1, text: '', enter: false }); return; }
  // Arrows, Tab, Delete ... and shortcuts go as keys; the box starts over after them
  const combo = keyCombo(e);
  if (!combo) return;
  e.preventDefault();
  liveSend({ key: combo });
  liveReset(QK);
});
// The phone keyboard's Enter
$('#qkForm').addEventListener('submit', e => { e.preventDefault(); liveEnter(QK); });

// A hardware keyboard (a tablet's, a laptop's) needs no box: in quick mode its keys go straight to the computer
// while Screen is showing and no text field has the focus
document.addEventListener('keydown', e => {
  if (!S.quick || !onScreen() || e.defaultPrevented || e.isComposing || e.keyCode === 229) return;
  if ($('#app').hidden || !$('#ask').hidden || (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]'))) return;
  const combo = keyCombo(e);
  const op = combo ? { key: combo }
    : e.key === 'Enter' ? { type: true, back: 0, text: '', enter: true }
    : e.key === 'Backspace' ? { type: true, back: 1, text: '', enter: false }
    : [...e.key].length === 1 ? { type: true, back: 0, text: e.key, enter: false } : null;
  if (!op) return;
  e.preventDefault();
  liveSend(op);
});

// The keyboard button (on Screen, and ⌨ in full screen) opens and closes the phone keyboard
const KB = { was: null, full: 0, shown: false };
function openKeys() { QK.focus({ preventScroll: true }); }
function closeKeys() { if (document.activeElement === QK) QK.blur(); }
function renderKeys() {
  const on = document.activeElement === QK;
  $('#kbBtn').setAttribute('aria-pressed', String(on));
  if (S.quick) $('#fsKb').setAttribute('aria-expanded', String(on));
}
function toggleKeys() {
  const was = KB.was ?? document.activeElement === QK;
  KB.was = null;
  if (was) closeKeys(); else openKeys();
}
[$('#kbBtn'), $('#fsKb')].forEach(b => {
  // Whether it was open before this tap: on some phones the tap itself takes the focus away first
  b.addEventListener('pointerdown', () => { KB.was = document.activeElement === QK; });
  b.addEventListener('mousedown', e => { if (S.quick) e.preventDefault(); });
});
$('#kbBtn').onclick = toggleKeys;
// The visible height at full size, the same when zoomed in
const vvh = () => visualViewport.height * visualViewport.scale;
QK.addEventListener('focus', () => { KB.full = window.visualViewport ? vvh() : 0; KB.shown = false; renderKeys(); });
QK.addEventListener('blur', renderKeys);
// Android can hide the keyboard (the back gesture) and leave the box focused: the box then lets go as well, so
// the next tap on the button opens the keyboard again
if (window.visualViewport) visualViewport.addEventListener('resize', () => {
  if (document.activeElement !== QK) return;
  if (vvh() < KB.full - 120) KB.shown = true;
  else if (KB.shown && vvh() > KB.full - 60) QK.blur();
});

// Touches on the image in quick mode. Tap: click, after a short wait in case a second tap follows · two taps:
// double-click · hold still for half a second: lifting right-clicks, moving drags with the left button held.
const QUICK = { dbl: 250, hold: 500, slop: 10, near: 32 };
function quickOn() { return S.quick && !S.mac.pick; }

// Point on the computer under the finger; outside the image null, or the nearest edge with `clamp`
function pcAt(img, e, clamp) {
  const r = img.getBoundingClientRect();
  if (!S.scr || !r.width) return null;
  let fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  if (clamp) { fx = Math.max(0, Math.min(1, fx)); fy = Math.max(0, Math.min(1, fy)); }
  else if (!(fx >= 0 && fy >= 0 && fx <= 1 && fy <= 1)) return null;
  return { x: Math.min(S.scr.x + S.scr.w - 1, Math.round(S.scr.x + fx * S.scr.w)), y: Math.min(S.scr.y + S.scr.h - 1, Math.round(S.scr.y + fy * S.scr.h)) };
}

function quickGestures(img, host) {
  let g = null, pend = null;   // the press under way; a tap waiting to see if a second follows
  const mark = (e, kind) => {
    const h = host(), m = $('.qmark', h), r = h.getBoundingClientRect();
    m.style.left = (e.clientX - r.left) + 'px'; m.style.top = (e.clientY - r.top) + 'px';
    m.className = 'qmark';
    if (kind) { void m.offsetWidth; m.classList.add(kind); }   // restarts the tap animation
  };
  const stopKeep = () => { if (g) clearInterval(g.keep); };
  return {
    active: () => !!g,
    holding: () => !!(g && g.hold),
    down(e) {
      const p = pcAt(img(), e);
      if (!p) return;
      g = { p, last: p, sx: e.clientX, sy: e.clientY, hold: false, drag: false, second: null };
      if (pend) {
        clearTimeout(pend.timer);
        if (Math.hypot(e.clientX - pend.x, e.clientY - pend.y) < QUICK.near) g.second = pend; else act('click', pend.p);
        pend = null;
      }
      g.timer = setTimeout(() => {
        if (!g) return;
        if (g.second) { act('click', g.second.p); g.second = null; }
        g.hold = true;
        if (navigator.vibrate) navigator.vibrate(15);
        mark({ clientX: g.sx, clientY: g.sy }, 'hold');
      }, QUICK.hold);
    },
    // Before the hold starts, moving gives the touch up (the page scrolls, or full screen pans)
    move(e) {
      if (!g) return;
      const moved = Math.hypot(e.clientX - g.sx, e.clientY - g.sy) > QUICK.slop;
      if (!g.hold) { if (moved) this.cancel(); return; }
      if (!g.drag && !moved) return;
      if (!g.drag) {
        g.drag = true;
        liveSend({ hold: 'down', ...g.p });
        // Tells the computer the finger is still there even if it does not move
        g.keep = setInterval(() => { if (g) liveSend({ hold: 'move', ...g.last }); }, 1000);
      }
      g.last = pcAt(img(), e, true) || g.last;
      liveSend({ hold: 'move', ...g.last });
      mark(e, 'hold');
    },
    up(e) {
      if (!g) return;
      clearTimeout(g.timer); stopKeep();
      const c = g; g = null;
      if (c.drag) { liveSend({ hold: 'up', ...(pcAt(img(), e, true) || c.last) }); mark(e); toast(t('act.done_drag')); return; }
      if (c.hold) { mark(e); act('right', c.p); return; }
      mark(e, 'tap');
      if (c.second) { act('double', c.second.p); return; }
      pend = { p: c.p, x: e.clientX, y: e.clientY, timer: setTimeout(() => { const p = pend.p; pend = null; act('click', p); }, QUICK.dbl) };
    },
    // The touch was taken away (scrolling, a second finger, leaving the view): a held button is let go
    cancel() {
      if (!g) return;
      clearTimeout(g.timer); stopKeep();
      if (g.drag) liveSend({ hold: 'up', ...g.last });
      if (g.second) act('click', g.second.p);
      if (g.hold) mark({ clientX: g.sx, clientY: g.sy });
      g = null;
    },
  };
}

const QV = quickGestures(() => $('#shot'), () => $('#view .stage'));
(() => {
  const tap = $('#tap');
  tap.addEventListener('pointerdown', e => { if (quickOn() && e.isPrimary && e.button === 0) { tap.setPointerCapture(e.pointerId); QV.down(e); } });
  tap.addEventListener('pointermove', e => { if (e.isPrimary) QV.move(e); });
  tap.addEventListener('pointerup', e => { if (e.isPrimary) QV.up(e); });
  tap.addEventListener('pointercancel', () => QV.cancel());
  // Once the hold has started the finger drags on the computer, not the page
  tap.addEventListener('touchmove', e => { if (QV.holding()) e.preventDefault(); }, { passive: false });
  tap.addEventListener('contextmenu', e => { if (quickOn()) e.preventDefault(); });
})();
const QF = quickGestures(() => $('#fsImg'), () => $('#fs'));
function quickStop() { QV.cancel(); QF.cancel(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) quickStop(); });

// ---------- keys ----------

// Two-tap confirmation: the first tap warns, a second within 3.5 s does it.
function arm(btn, text) {
  const lbl = $('.lbl', btn) || btn;
  const reset = () => { btn.dataset.armed = ''; lbl.textContent = btn.dataset.orig; btn.classList.remove('armed'); };
  if (btn.dataset.armed === '1') { clearTimeout(btn._armT); reset(); return true; }
  btn.dataset.orig = lbl.textContent; btn.dataset.armed = '1'; lbl.textContent = text; btn.classList.add('armed');
  btn._armT = setTimeout(() => { if (btn.dataset.armed === '1') reset(); }, 3500);
  return false;
}

// Together with the selected modifiers: with Ctrl selected "c" -> "ctrl+c"; always in the order Ctrl, Alt, Shift, Win
function withMods(combo) {
  if (!S.mods.size) return combo;
  const parts = combo.split('+');
  return [...MODS.filter(m => S.mods.has(m) || parts.includes(m)), ...parts.filter(p => !MODS.includes(p))].join('+');
}

async function sendKey(combo, remember) {
  try {
    await api('/api/key', { combo });
    toast(t('toast.sent', { combo }));
    if (remember) addRecent(combo);
    clearMods();
    after();
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (!b) return;
  if (b.hasAttribute('data-risky') && !arm(b, t('common.sure'))) return;
  // Modifier keys apply only on the Keyboard tab
  const mods = !!b.closest('#p-keyboard') && S.mods.size > 0;
  sendKey(mods ? withMods(b.dataset.k) : b.dataset.k, mods);
});

function renderMods() {
  $$('[data-mod]').forEach(b => b.setAttribute('aria-pressed', String(S.mods.has(b.dataset.mod))));
  const on = MODS.filter(m => S.mods.has(m)), sel = on.map(prettyCombo).join(' + ');
  $('#modHint').textContent = !sel ? t('kb.mod_hint') : on.join() === 'ctrl' ? t('kb.mod_on_ctrl', { mods: sel }) : t('kb.mod_on', { mods: sel });
  $('#modLetter').placeholder = sel ? t('kb.letter_with', { mods: sel }) : t('kb.letter');
}
function clearMods() { if (S.mods.size) { S.mods.clear(); renderMods(); } }
$$('[data-mod]').forEach(b => b.onclick = () => {
  const m = b.dataset.mod;
  if (S.mods.has(m)) S.mods.delete(m); else S.mods.add(m);
  renderMods();
});

// A single letter or digit: sent with the selected modifiers as soon as it is typed (Ctrl + L, Win + R ...)
$('#modLetter').addEventListener('input', e => {
  const c = [...e.target.value.trim()].pop();
  e.target.value = '';
  if (!c) return;
  if (c === '+' || /\s/.test(c)) { toast(t('kb.one_letter'), true); return; }
  sendKey(withMods(c.toLowerCase()), S.mods.size > 0);
});
$('#modForm').addEventListener('submit', e => e.preventDefault());

// ---------- clipboard ----------
// Only on request, both ways: the computer's clipboard may hold a password just copied.
$('#clipGet').onclick = async () => {
  try {
    const r = await api('/api/clipboard');
    if (!r.text) { $('#clipBox').hidden = true; toast(t('kb.clip_empty')); return; }
    $('#clipText').value = r.text;
    $('#clipCount').textContent = t('kb.count', { n: [...r.text].length });
    $('#clipBox').hidden = false;
    if (r.cut) toast(t('kb.clip_cut', { n: r.cut }));
  } catch (e) { toast(e.message, true); }
};
$('#clipSet').onclick = async () => {
  const text = $('#text').value;
  if (!text) { toast(t('kb.clip_need_text'), true); $('#text').focus(); return; }
  try { const r = await api('/api/clipboard', { text }); toast(t('toast.clip_set', { n: r.n })); }
  catch (e) { toast(e.message, true); }
};
// The phone's clipboard API needs HTTPS (through the tunnel); on the home network selecting the text and
// copying it the older way still works
$('#clipCopy').onclick = async () => {
  const ta = $('#clipText');
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(ta.value); ok = true; } } catch (_) {}
  if (!ok) {
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.blur();
  }
  toast(ok ? t('kb.clip_copied') : t('kb.clip_copy_fail'), !ok);
};

function addRecent(c) {
  S.recent = [c, ...S.recent.filter(x => x !== c)].slice(0, 6);
  store.set('recent', S.recent); renderRecent();
}
function renderRecent() {
  $('#recent').replaceChildren(...S.recent.map(c => h('button', { type: 'button', 'aria-label': t('kb.send_label', { combo: c }), onclick: () => sendKey(c, true) }, prettyCombo(c))));
}

$('#fkeys').replaceChildren(...Array.from({ length: 12 }, (_, i) => h('button', { type: 'button', class: 'key', 'data-k': 'f' + (i + 1) }, 'F' + (i + 1))));

// ---------- keyboard: text ----------

function updateCount() { $('#count').textContent = t('kb.count', { n: [...$('#text').value].length }); }
$('#text').addEventListener('input', updateCount);

async function typeText(enter) {
  const ta = $('#text'), v = ta.value;
  if (!v && !enter) { ta.focus(); return; }
  if (await sendText(v, enter)) { ta.value = ''; updateCount(); }
}
$('#typeBtn').onclick = () => typeText(false);
$('#typeEnterBtn').onclick = () => typeText(true);

// ---------- elements ----------

function center(r) { return { x: Math.round(r.x + r.w / 2), y: Math.round(r.y + r.h / 2) }; }

// Named clickable elements of the foreground window and the taskbar (Windows UI Automation)
async function loadElements() {
  const btn = $('#elRefresh');
  btn.disabled = true; btn.classList.add('spin');
  if (!S.els) $('#elList').replaceChildren(h('li', { class: 'empty' }, t('common.loading')));
  try {
    S.els = (await api('/api/elements')).map(e => {
      const bar = e.source === 'taskbar';
      return {
        name: e.name, kind: kindName(e.kind), raw: e.kind, group: GROUP[e.kind] || 'button', rect: e.rect, bar,
        cap: !bar && e.kind === 'button' && CAPTION.has(fold(e.name.trim())),
      };
    });
    renderElements();
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.classList.remove('spin'); }
}

function elRow(it) {
  const text = it.raw === 'text field';
  return h('li', {},
    h('button', { type: 'button', class: 'rowmain', 'aria-label': t('el.aim_label', { name: it.name }), onclick: () => aimAt(it) },
      svgIcon(ICON.cross),
      h('span', { class: 'rowtext' }, h('span', { class: 'rowname' }, it.name), h('span', { class: 'rowsub' }, it.kind))),
    h('button', { type: 'button', class: 'rowside', 'aria-label': text ? t('el.type_label', { name: it.name }) : t('el.click_label', { name: it.name }), onclick: () => text ? typeInto(it) : clickElement(it) }, text ? t('common.type') : t('act.click')));
}

function renderElements() {
  const all = S.els || [];
  const q = fold($('#elQ').value.trim());
  const hits = q ? all.filter(e => fold(e.name).includes(q)) : all;
  // A filter shows only if the list has elements of that kind; counts follow the search
  const has = k => k === 'all' || all.some(e => e.group === k);
  if (!has(S.elKind)) S.elKind = 'all';
  const counts = { all: hits.length };
  for (const e of hits) counts[e.group] = (counts[e.group] || 0) + 1;
  $('#elChips').hidden = !all.length;
  $('#elChips').replaceChildren(...GROUPS.filter(has).map(k =>
    h('button', { type: 'button', 'aria-pressed': String(S.elKind === k), onclick: () => { S.elKind = k; renderElements(); } },
      t('group.' + k), h('span', { class: 'n' }, String(counts[k] || 0)))));

  const shown = S.elKind === 'all' ? hits : hits.filter(e => e.group === S.elKind);
  const win = shown.filter(e => !e.bar && !e.cap).sort((a, b) => ORDER[a.group] - ORDER[b.group]);
  const cap = shown.filter(e => e.cap), bar = shown.filter(e => e.bar);
  $('#elWinHead').textContent = t('el.win_head', { n: win.length });
  $('#elList').replaceChildren(...(win.length ? win.map(elRow)
    : [h('li', { class: 'empty' }, q || S.elKind !== 'all' ? t('el.none_match') : t('el.none'))]));
  $('#elCapHead').hidden = !cap.length;
  $('#elCap').replaceChildren(...cap.map(elRow));
  $('#elBarHead').textContent = t('el.bar_head', { n: bar.length });
  $('#elBarHead').hidden = !bar.length;
  $('#elBar').replaceChildren(...bar.map(elRow));
}
$('#elQ').addEventListener('input', renderElements);
$('#elRefresh').onclick = loadElements;

// Tapping a row aims at the element on Screen: click or scroll with the bar, see it in the magnifier.
function aimAt(it) {
  const p = center(it.rect), a = S.scr;
  showTab('screen');
  if (a && p.x >= a.x && p.y >= a.y && p.x < a.x + a.w && p.y < a.y + a.h) { setAim(p); return; }
  // Outside the image (e.g. the taskbar in the window view): switch to the whole screen and aim on the new frame
  S.view = 'screen'; store.set('view', S.view); renderView();
  S.aimNext = p; newPicture();
}

async function clickElement(it, quiet) {
  const c = center(it.rect);
  try {
    await api('/api/click', { x: c.x, y: c.y, label: it.name });
    if (!quiet) toast(t('toast.clicked', { name: it.name }));
    // The click may have changed the screen: refresh the list
    setTimeout(() => { refresh(); status(); if (S.tab === 'elements') loadElements(); }, 600);
  } catch (e) { toast(e.message, true); }
}

// Text field: click the field on the computer and open the typing box on Screen on the phone (with Quick on,
// the phone keyboard). Focus must happen inside the tap, otherwise the phone does not open its keyboard.
function typeInto(it) {
  showTab('screen');
  if (S.quick) openKeys(); else $('#qt').focus();
  S.typeInto = it.name; renderQtPlaceholder();
  clickElement(it, true);
}

// The app's real icon; the name's first letter if unavailable
function appIcon(src, name) {
  const box = h('span', { class: 'appic', 'aria-hidden': 'true' });
  const img = h('img', { src, alt: '', loading: 'lazy', decoding: 'async' });
  img.onerror = () => img.replaceWith(h('span', { class: 'letter' }, (name || '?').trim().charAt(0).toLocaleUpperCase(I18N.lang) || '?'));
  box.append(img);
  return box;
}

      try {

      w.elevated ? h('span', { class: 'badge bad' }, t('win.badge_admin')) : null,

    return h('li', {},
      h('button', { type: 'button', class: 'rowmain', 'aria-label': t('win.front_label', { name: title }), onclick: () => focus(false) },
        appIcon('/api/icon?hwnd=' + w.hwnd, w.app || title),
        h('span', { class: 'rowtext' },
          h('span', { class: 'rowname clamp2' }, title),
          h('span', { class: 'rowmeta' }, w.app && w.app !== title ? h('span', { class: 'rowsub' }, w.app) : null, badges))),
      h('button', { type: 'button', class: 'rowact', 'aria-label': t('win.max_label', { name: title }), onclick: () => focus(true) }, svgIcon(ICON.max)),
      w.own ? h('span', { class: 'rowact locked', title: t('win.own_title') }, svgIcon(ICON.lock))
        : h('button', { type: 'button', class: 'rowact', 'aria-label': t('win.close_label', { name: title }), onclick: e => closeWindow(e.currentTarget, w) }, svgIcon(ICON.close)));
  }));
}

function renderWl() {

function startCountdown(secs) {
  S.offUntil = Date.now() + secs * 1000; S.offStarted = Date.now();
  clearInterval(S.offTimer);
  exitFs();   // so the countdown strip and the cancel button are visible
  const tick = () => {
    const left = Math.ceil((S.offUntil - Date.now()) / 1000);
    $('#offCancel').hidden = left <= 0;
    $('#offLeft').textContent = left > 0 ? t('off.left', { s: left }) : t('off.now');
    if (left <= 0) clearInterval(S.offTimer);
  };
  $('#offBanner').hidden = false;
  tick(); S.offTimer = setInterval(tick, 250);
}
function stopCountdown() { clearInterval(S.offTimer); S.offUntil = 0; $('#offBanner').hidden = true; }

// The countdown stays in sync with the server even after a reload or a cancel from elsewhere.
// Wait the first 3 s so a stale status response sent before the shutdown request does not close the strip.
function syncShutdown(left) {
  if (left != null && !S.offUntil) startCountdown(left);
  else if (left == null && S.offUntil && Date.now() - S.offStarted > 3000 && Date.now() < S.offUntil - 1500) stopCountdown();
}

// The image fits the screen; pinch to zoom, drag with one finger to pan, tap to aim.
// Z: zoom (k) and the on-screen position of the image's top-left corner (x, y); bw/bh is the fitted size.
const Z = { k: 1, x: 0, y: 0, bw: 0, bh: 0, W: 0, H: 0 };
const ZMAX = 8;

function fsLayout(reset) {
  const fs = $('#fs'), img = $('#fsImg');
  const W = fs.clientWidth, H = fs.clientHeight;
  const nw = img.width || (S.scr && S.scr.w) || 16, nh = img.height || (S.scr && S.scr.h) || 9;
  const s = Math.min(W / nw, H / nh), bw = nw * s, bh = nh * s;
  if (reset || !Z.bw) { Z.k = 1; }
  else {
    // When the size changes (rotation, keyboard) the centre point stays centred
    const cx = (Z.W / 2 - Z.x) / (Z.bw * Z.k), cy = (Z.H / 2 - Z.y) / (Z.bh * Z.k);
    Z.x = W / 2 - cx * bw * Z.k; Z.y = H / 2 - cy * bh * Z.k;
  }
  Object.assign(Z, { bw, bh, W, H });
  img.style.width = bw + 'px'; img.style.height = bh + 'px';
  fsApply();
}
function fsClamp() {
  const w = Z.bw * Z.k, h = Z.bh * Z.k;
  Z.x = w <= Z.W ? (Z.W - w) / 2 : Math.min(0, Math.max(Z.W - w, Z.x));
  Z.y = h <= Z.H ? (Z.H - h) / 2 : Math.min(0, Math.max(Z.H - h, Z.y));
}
function fsApply() {
  fsClamp();
  $('#fsImg').style.transform = 'translate(' + Z.x + 'px,' + Z.y + 'px) scale(' + Z.k + ')';
  placeAim();
}
function fsZoom(k, cx, cy) {
  k = Math.max(1, Math.min(ZMAX, k));
  const px = (cx - Z.x) / Z.k, py = (cy - Z.y) / Z.k;
  Z.k = k; Z.x = cx - px * k; Z.y = cy - py * k;
  fsApply();
}

function enterFs(real) {

      .then(() => screen.orientation.lock('landscape')).catch(() => {});

}

}

(() => {
  const stage = $('#fsStage'), P = new Map();
  let G = null;   // gesture in progress
  const pinch = () => {
    const [a, b] = [...P.values()];
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    return { pinch: true, d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, k0: Z.k, px: (m.x - Z.x) / Z.k, py: (m.y - Z.y) / Z.k };
  };
  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    P.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (P.size === 1) { G = { tap: true, t: Date.now(), sx: e.clientX, sy: e.clientY, x0: Z.x, y0: Z.y }; if (quickOn() && e.button === 0) QF.down(e); }
    else if (P.size === 2) { QF.cancel(); G = pinch(); }
  });
  stage.addEventListener('pointermove', e => {
    if (!P.has(e.pointerId) || !G) return;
    P.set(e.pointerId, { x: e.clientX, y: e.clientY });
    // Held: the finger drags on the computer; a quick move before that pans as usual
    if (QF.holding()) { QF.move(e); return; }
    QF.move(e);
    if (G.pinch && P.size >= 2) {
      const [a, b] = [...P.values()];
      const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const k = Math.max(1, Math.min(ZMAX, G.k0 * Math.hypot(a.x - b.x, a.y - b.y) / G.d0));
      Z.k = k; Z.x = m.x - G.px * k; Z.y = m.y - G.py * k;
      fsApply();
    } else if (!G.pinch) {
      const dx = e.clientX - G.sx, dy = e.clientY - G.sy;
      if (G.tap && Math.hypot(dx, dy) > 8) G.tap = false;
      if (!G.tap && Z.k > 1) { Z.x = G.x0 + dx; Z.y = G.y0 + dy; fsApply(); }
    }
  });
  const end = e => {
    if (!P.has(e.pointerId)) return;
    P.delete(e.pointerId);
    if (QF.active()) { if (e.type === 'pointerup' && !P.size) QF.up(e); else QF.cancel(); }
    else if (e.type === 'pointerup' && G && G.tap && !G.pinch && !P.size && Date.now() - G.t < 600 && !quickOn()) {
      const r = $('#fsImg').getBoundingClientRect();
      tapAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
    }
    if (P.size === 1) { const [r] = [...P.values()]; G = { tap: false, sx: r.x, sy: r.y, x0: Z.x, y0: Z.y }; }
    if (!P.size) G = null;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('contextmenu', e => e.preventDefault());
  stage.addEventListener('wheel', e => { e.preventDefault(); fsZoom(Z.k * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
})();

// ---------- files ----------
// To the phone: a folder under Desktop, Documents, Downloads, Pictures or Videos, or the file selected in File
// Explorer; downloaded by the phone's browser. From the phone: into Downloads, in pieces (files.rs).
const ROOTS = { downloads: 'files.downloads', desktop: 'files.desktop', documents: 'files.documents', pictures: 'files.pictures', videos: 'files.videos' };
const F = { root: 'downloads', path: [], seq: 0 };
const ICON_FILE = 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5';
const ICON_DIR = 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z';

function fmtSize(n) {
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return new Intl.NumberFormat(I18N.lang, { maximumFractionDigits: i && n < 10 ? 1 : 0 }).format(n) + ' ' + u[i];
}
function fmtDate(secs) {
  const d = new Date(secs * 1000), now = new Date();
  const opt = d.toDateString() === now.toDateString() ? { hour: 'numeric', minute: '2-digit' }
    : d.getFullYear() === now.getFullYear() ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' };
  return new Intl.DateTimeFormat(I18N.lang, opt).format(d);
}
// The phone's browser saves it; the page stays where it is
function download(url) {
  const a = h('a', { href: url, download: '' });
  document.body.append(a); a.click(); a.remove();
}

function renderRoots() {
  $('#fileRoots').replaceChildren(...Object.entries(ROOTS).map(([r, k]) => h('button', { type: 'button', 'aria-pressed': String(F.root === r),
    onclick: () => { F.root = r; F.path = []; renderRoots(); loadFiles(); } }, t(k))));
}
function renderCrumb() {
  const parts = [t(ROOTS[F.root]), ...F.path];
  $('#fileCrumb').replaceChildren(...parts.flatMap((p, i) => {
    const last = i === parts.length - 1;
    const el = last ? h('span', null, p) : h('button', { type: 'button', onclick: () => { F.path = F.path.slice(0, i); loadFiles(); } }, p);
    return i ? [h('span', { 'aria-hidden': 'true' }, '›'), el] : [el];
  }));
}
async function loadFiles() {
  const seq = ++F.seq;
  renderRoots(); renderCrumb();
  try {
    const r = await api('/api/files?' + new URLSearchParams({ root: F.root, path: F.path.join('/') }));
    if (seq !== F.seq) return;
    const rows = r.entries.map(e => {
      const meta = e.dir ? '' : fmtSize(e.size) + ' · ' + fmtDate(e.modified);
      const inner = [svgIcon(e.dir ? ICON_DIR : ICON_FILE), h('span', { class: 'ftext' }, h('span', { class: 'fname' }, e.name), meta && h('span', { class: 'fmeta' }, meta))];
      if (e.dir) return h('li', null, h('button', { type: 'button', 'aria-label': t('files.open_label', { name: e.name }), onclick: () => { F.path.push(e.name); loadFiles(); } }, ...inner));
      const url = '/api/files/get?' + new URLSearchParams({ root: F.root, path: [...F.path, e.name].join('/') });
      return h('li', null, h('a', { href: url, download: e.name, 'aria-label': t('files.get_label', { name: e.name }) }, ...inner));
    });
    if (!rows.length) rows.push(h('li', null, h('p', { class: 'fnote' }, t('files.empty'))));
    if (r.cut) rows.push(h('li', null, h('p', { class: 'fnote' }, t('files.cut', { n: r.entries.length }))));
    $('#fileList').replaceChildren(...rows);
  } catch (e) {
    if (seq !== F.seq) return;
    $('#fileList').replaceChildren(h('li', null, h('p', { class: 'fnote' }, e.message)));
  }
}

// The file selected in File Explorer: one is downloaded at once, several are listed to choose from
$('#fileSel').onclick = async () => {
  try {
    const r = await api('/api/files/selected');
    const files = r.items.filter(i => !i.dir);
    $('#fileSelList').replaceChildren();
