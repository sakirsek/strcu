[package]
name = "strcu"
version = "2.0.5"
edition = "2024"
description = "Use your computer from your phone"
license = "MIT"
repository = "https://github.com/sakirsek/strcu"
publish = false

[features]
# A build that keeps away from the installed StrCu: its own name, folders, service and port (see src/brand.rs)
devbuild = []

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
# Terminal interface: raw keys, colours, alternate screen
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
# The panel page goes gzipped; image already builds it
flate2 = "1"
getrandom = "0.3"
# Counting what the panel sends (usage.rs); axum already builds it
http-body = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# JPEG for the live view: about three times faster than image's own encoder
jpeg-encoder = { version = "0.6", features = ["simd"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# Passkey (fingerprint / face sign-in) signatures (ES256); jsonwebtoken already builds the same version
p256 = "0.13"
# QR code for pairing a phone, drawn in the terminal
qrcode = { version = "0.14.1", default-features = false }
# Windows' own TLS (SChannel) for HTTPS; no extra build dependency
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
# uiautomation also uses windows 0.62; staying on the same version builds a single copy.
uiautomation = "0.25"
# Being a Windows service: the dispatcher Windows talks to, and installing the service (svc.rs)
windows-service = "0.8.1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
# The icon and version details in strcu.exe (build.rs); Windows' own resource compiler does the work
winresource = { version = "0.1.34", default-features = false }
